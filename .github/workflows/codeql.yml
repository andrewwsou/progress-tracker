name: CodeQL

# Static analysis for security bugs (injection, unsafe deserialization, path traversal, ...).
# Findings appear in the repository's Security tab and on the pull requests that introduce them.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, so new queries also run against code that has not changed

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload the results
    strategy:
      fail-fast: false
      matrix:
        # The backends (Java), the frontend (TypeScript), the Lambda handlers (Python), and these
        # workflow files themselves. None needs a build: CodeQL reads the source directly.
        language: [java-kotlin, javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
