name: Load test

# Run by hand from the Actions tab. Load tests are slow and their timings depend on the runner,
# so they are not part of the checks that run on every push.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario to run (see load/README.md)
        type: choice
        default: all
        options:
          - all
          - contention
          - compare
          - streak
          - reset
          - chaos
          - drain

permissions:
  contents: read

jobs:
  load-test:
    name: Load test (${{ inputs.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Starts the stack with Docker Compose, drives it with k6, and checks the database afterwards.
      - name: Run the scenario
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: ./load/run.sh "$SCENARIO"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-test-results
          path: load/results/
          if-no-files-found: ignore
