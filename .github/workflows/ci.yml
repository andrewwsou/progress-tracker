name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI never calls the Claude API: summaries are written by the template, and the tests use WireMock.
env:
  SUMMARY_LLM_ENABLED: "false"

jobs:
  backend:
    name: Backend (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [progresstracker, progress-worker]
    defaults:
      run:
        working-directory: backend/${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/${{ matrix.module }}/pom.xml

      # Unit tests, then integration tests against PostgreSQL and an SQS-compatible broker
      # that Testcontainers starts in Docker, then the coverage gate.
      - name: Build and test
        run: ../progresstracker/mvnw -B -ntp verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.module }}
          path: backend/${{ matrix.module }}/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # The API types are generated from the backend's committed OpenAPI contract.
      # Fail if someone changed the contract without regenerating them.
      - name: Generated API types are up to date
        run: |
          npm run generate:api
          git diff --exit-code -- src/api-types.ts

      - run: npm run lint
      - run: npm test
      - run: npm run build

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Terraform format
        run: terraform fmt -check -recursive
        working-directory: infra/terraform

      # -backend=false: validate the configuration without AWS credentials or remote state.
      - name: Terraform validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
        working-directory: infra/terraform

      - name: Lambda handlers compile
        run: python3 -m py_compile infra/lambda/*/handler.py

      # Invokes each handler against a local HTTP server standing in for the API.
      - name: Lambda handler tests
        run: python3 -m unittest discover -s infra/lambda -p "test_*.py"

  end-to-end:
    name: End-to-end (Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build images and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      # Completes a habit over HTTP and waits for the worker to grant the reward.
      - name: Smoke test
        run: ./scripts/smoke-test.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
