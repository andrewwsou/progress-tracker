# All deployment-specific values come from environment variables (see .env.example).
# Defaults are for local development only.
spring:
  application:
    name: progress-worker

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/progresstracker}
    username: ${DB_USERNAME:ptrack}
    password: ${DB_PASSWORD:ptrack}
    hikari:
      # Each message being processed holds one connection; worker.concurrency must leave two spare.
      maximum-pool-size: ${DB_POOL_SIZE:10}

  lifecycle:
    # Shutdown: the queue poller drains first (worker.shutdownTimeoutSeconds), then the summary
    # job gets this long to finish its current summary. Together they fit in Compose's 35 s grace.
    timeout-per-shutdown-phase: 5s

  jpa:
    # No web requests read entities, so there is no session to keep open for them.
    open-in-view: false
    hibernate:
      # The API owns the schema and migrates it (Flyway) before this worker starts. The worker only
      # checks at startup that its entity copies still match it, so drift fails fast.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

queue:
  # The worker only polls when this is true and QUEUE_SQS_URL is set.
  enabled: ${QUEUE_ENABLED:false}
  awsRegion: ${AWS_REGION:us-west-1}
  sqsUrl: ${QUEUE_SQS_URL:}
  # Leave blank for real AWS. Set to reach a local SQS-compatible broker.
  endpointOverride: ${QUEUE_ENDPOINT_OVERRIDE:}

worker:
  enabled: true
  waitTimeSeconds: 20
  maxMessages: 10
  visibilityTimeoutSeconds: 60
  # Deadline for applying one reward. Bounds how long a transaction waits on a lock.
  processTimeoutSeconds: 5
  # Messages processed at the same time. Rewards for one user still apply one at a time (a row
  # lock), so this helps when events are spread over many users.
  concurrency: ${WORKER_CONCURRENCY:8}
  # On shutdown: stop polling, then give the messages in flight this long to finish.
  shutdownTimeoutSeconds: 25
  # Health turns DOWN if the poll loop has died or has not polled for this long. Above the worst
  # normal gap: one bounded SQS call (30 s) plus the longest backoff (30 s) plus a busy worker.
  pollStaleAfterSeconds: 120

# Health checks and metrics. Only the worker's own network can reach this port; Compose does
# not publish it, and in AWS it belongs behind a private security group.
server:
  port: 8081
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        # Liveness fails if the poll loop dies, so an orchestrator restarts the worker.
        liveness:
          include: livenessState,sqsPoller
  metrics:
    tags:
      application: ${spring.application.name}

# Weekly summaries: the API asks for them, this worker writes them (see README "Weekly summaries").
summary:
  llm:
    # Claude is used only when this is true AND a key is set. Off by default, so a key that
    # happens to be in the environment never turns spending on. Off: no API calls at all.
    enabled: ${SUMMARY_LLM_ENABLED:false}
    api-key: ${ANTHROPIC_API_KEY:}
    # Must be claude-opus-5-5 or claude-sonnet-5-5; anything else falls back to the template.
    model: ${SUMMARY_LLM_MODEL:claude-opus-5-5}
    # A short summary needs little reasoning; low effort keeps it fast and cheap.
    effort: low
    # Hard cap on one response, thinking included.
    max-output-tokens: 2048
    # Per attempt. No retries: if a call fails, the template writes that summary.
    timeout: 30s
    max-retries: 0
    # Blank for the real API. Only tests set it.
    base-url: ${SUMMARY_LLM_BASE_URL:}
    # If the model declines a request, re-run it on Anthropic's recommended fallback model.
    refusal-fallbacks: true
    # Hard daily caps (UTC day, all workers together). Each call is counted before it is sent,
    # at its worst case, and never refunded. Past a cap, the template writes the rest of the day.
    # With these defaults a day costs at most about $1.25 at Opus 5.5 prices; 0 calls stops all calls.
    max-calls-per-day: ${SUMMARY_LLM_MAX_CALLS_PER_DAY:10}
    daily-token-budget: 100000
    # Bigger weeks are written by the template, so one prompt cannot be large.
    max-habits: 20
    max-prompt-bytes: 8000
  job:
    # How often to look for summaries to write.
    fixed-delay-ms: 15000
    batch-size: 5
    # A claim lasts this long; a summary whose worker crashed is picked up again after it.
    lease: 5m
    max-attempts: 3
