spring:
  application:
    name: progress-worker

  datasource:
    url: jdbc:postgresql://localhost:5432/progresstracker
    username: ptrack
    password: ptrack

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

queue:
  enabled: true
  awsRegion: us-west-1
  sqsUrl: "https://sqs.us-west-1.amazonaws.com/648093549515/progresstracker-completions"

worker:
  enabled: true
  waitTimeSeconds: 20
  maxMessages: 10
  visibilityTimeoutSeconds: 60
