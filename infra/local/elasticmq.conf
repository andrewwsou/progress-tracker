# ElasticMQ: an SQS-compatible broker used by compose.yaml for local runs and CI.
# The queues mirror infra/terraform/sqs.tf so local behaviour matches production.
include classpath("application.conf")

node-address {
  protocol = http
  host = sqs
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  progresstracker-completions {
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue {
      name = "progresstracker-completions-dlq"
      maxReceiveCount = 5
    }
  }
  progresstracker-completions-dlq { }
}
